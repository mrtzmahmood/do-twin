# CORS for the management HTTP API — needed for any browser-based client.
# Not required once the FastAPI backend proxies RabbitMQ (browsers never hit
# this API directly anymore), but harmless to leave on for local debugging
# via the RabbitMQ UI / curl.
management.cors.allow_origins.1 = *
management.cors.max_age = 3600

management_agent.disable_metrics_collector = false

# Pre-load the exchange/queue defined in definitions.json on first boot.
load_definitions = /etc/rabbitmq/definitions.json
