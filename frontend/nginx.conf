server {
    listen 80;
    server_name _;

    # nginx defaults to a 1MB request body limit — a plant flow-sheet SVG
    # (or any other page state) blows past that easily and gets a silent
    # 413 before it ever reaches the backend. Raise it well above anything
    # this app plausibly saves.
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index DoTwin_Pipeline_Builder.html;

    location / {
        # This is one big HTML file that changes often during development —
        # without this, browsers happily cache it and "the fix I just shipped"
        # silently doesn't apply until a hard-refresh, which looks exactly
        # like the bug is still there.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /DoTwin_Pipeline_Builder.html;
    }

    # REST endpoints
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket endpoints (MQTT relay) need the upgrade headers.
    location /api/mqtt/ws {
        proxy_pass http://backend:8000/api/mqtt/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
