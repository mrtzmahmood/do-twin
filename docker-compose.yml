version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotwin-pipeline
    ports:
      - "8000:8000"
    volumes:
      # Persist pipeline data outside the container
      - ./data:/app/data
      # Persist uploaded HTML files and backups
      - ./uploads:/app/uploads
      # Hot-reload frontend without rebuild
      # (comment out in production)
      - ./frontend:/app/frontend:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
